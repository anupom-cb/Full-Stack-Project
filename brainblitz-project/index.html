<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BrainBlitz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&family=Fraunces:ital,wght@1,600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="top">
    <div class="wrap">
      <button class="brand" data-act="nav" data-v="home" aria-label="BrainBlitz home"><span class="logo"><svg width="20"
            height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L4 14h6l-1 8 9-12h-6z" />
          </svg></span>BrainBlitz</button>
      <nav class="nav" id="nav1" aria-label="Main"></nav>
      <button class="iconbtn" data-act="theme" aria-label="Switch light or dark theme" title="Theme"><svg
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg></button>
    </div>
  </header>
  <div class="wrap">
    <main id="main"></main>
  </div>
  <nav class="tabbar" id="nav2" aria-label="Main"></nav>
  <div id="modal"></div>
  <div id="toast"></div>

  <script src="app.js"></script>
</body>

</html>
